<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Dreamscroll: a happily sleeping crescent moon in a calm green night. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#143329"/>
      <stop offset="1" stop-color="#2f6b52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.44" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#d9f2e2" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#d9f2e2" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#d9f2e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9e8"/>
      <stop offset="1" stop-color="#f3e2b3"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="640" cy="360" r="262" fill="#000"/>
    </mask>
    <symbol id="sparkle" viewBox="-50 -50 100 100">
      <path d="M0 -50 C6 -12 12 -6 50 0 C12 6 6 12 0 50 C-6 12 -12 6 -50 0 C-12 -6 -6 -12 0 -50Z"/>
    </symbol>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="450" cy="530" r="460" fill="url(#glow)"/>
  <g transform="translate(40 -14)">
  <!-- the moon -->
  <circle cx="460" cy="548" r="318" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- closed, smiling eye and a smile on the crescent -->
  <g fill="none" stroke="#2a4f40" stroke-width="22" stroke-linecap="round">
    <path d="M262 556 Q300 596 338 556"/>
    <path d="M330 706 Q392 760 462 726"/>
  </g>
  <!-- rosy cheek -->
  <ellipse cx="262" cy="640" rx="34" ry="22" fill="#f2a7a0" opacity="0.55"/>
  </g>
  <!-- sparkles -->
  <g fill="#fff6dc">
    <use href="#sparkle" x="760" y="690" width="120" height="120"/>
    <use href="#sparkle" x="836" y="540" width="60" height="60" opacity="0.85"/>
    <use href="#sparkle" x="740" y="200" width="84" height="84" opacity="0.9"/>
  </g>
  <g fill="#bfe8cf">
    <circle cx="560" cy="170" r="9"/>
    <circle cx="880" cy="380" r="8"/>
    <circle cx="200" cy="230" r="10"/>
    <circle cx="610" cy="860" r="8"/>
  </g>
</svg>
