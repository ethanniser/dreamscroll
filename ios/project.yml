name: Dreamscroll
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Dreamscroll:
    type: application
    platform: iOS
    sources:
      - path: Dreamscroll
      - path: Shared
      # One source of truth: the browser extension's policy and page filtering.
      - path: ../extension/policy.js
        buildPhase: resources
      - path: ../extension/content.js
        buildPhase: resources
      - path: ../extension/content.css
        buildPhase: resources
      # X For You snapshot: capture, parser and the feed page (same files as the extension).
      - path: ../extension/timeline.js
        buildPhase: resources
      - path: ../extension/capture-main.js
        buildPhase: resources
      - path: ../extension/feed.html
        buildPhase: resources
      - path: ../extension/feed-page.js
        buildPhase: resources
      - path: ../extension/feed-page.css
        buildPhase: resources
      - path: ../extension/popup.css
        buildPhase: resources
    info:
      path: Dreamscroll/Info.plist
      properties:
        CFBundleDisplayName: Dreamscroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [dreamscroll]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan the sync QR code shown by the Dreamscroll browser extension.
        DreamscrollAppGroup: group.$(BUNDLE_ID_PREFIX).dreamscroll
        DreamscrollBlockerIdentifier: $(BUNDLE_ID_PREFIX).dreamscroll.blocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dreamscroll
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Dreamscroll/Dreamscroll.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).dreamscroll]
    dependencies:
      - target: ShareExtension
      - target: SafariBlocker
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Dreamscroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dreamscroll.share
  SafariBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariBlocker
      - path: Shared
    entitlements:
      path: SafariBlocker/SafariBlocker.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).dreamscroll]
    info:
      path: SafariBlocker/Info.plist
      properties:
        CFBundleDisplayName: Dreamscroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DreamscrollAppGroup: group.$(BUNDLE_ID_PREFIX).dreamscroll
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dreamscroll.blocker
