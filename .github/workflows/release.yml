name: Release

# Push a tag like v1.2.0 (after `bun run set-version -- 1.2.0` and a CHANGELOG entry).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the extension version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version extension/manifest.json)" = "$version" || { echo "manifest.json is not $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section"; exit 1; }
      - name: Package the extension
        run: |
          cd extension && zip -r "../dreamscroll-extension-${GITHUB_REF_NAME}.zip" . -x '_metadata/*'
          cd .. && zip "dreamscroll-extension-${GITHUB_REF_NAME}.zip" LICENSE
      - name: Release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dreamscroll-extension-${GITHUB_REF_NAME}.zip" --title "Dreamscroll ${GITHUB_REF_NAME#v}" --notes-file notes.md
