name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4   # the tests use Node's built-in runner
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check

  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4   # vitest and the Convex CLI run on Node
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build for the Simulator (unsigned)
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Dreamscroll.xcodeproj -scheme Dreamscroll -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
